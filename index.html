<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --wall: #c9ccce;
  --wall-ink: #2a2d31;
  --housing: #3a3d42;
  --housing-edge: #55595f;
  --panel: #000;
  --led-white: #f2f2ea;
  --led-amber: #ffa21a;
  --led-orange: #ff7a1a;
  --led-green: #2fe06a;
  --led-red: #ff3b30;
  --led-blue: #3aa8ff;
  --line-red: #d7141a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --wall: #1c1e21; --wall-ink: #c9ccd1; --housing: #2b2e33; --housing-edge: #43474d; }
}
:root[data-theme="dark"] { --wall: #1c1e21; --wall-ink: #c9ccd1; --housing: #2b2e33; --housing-edge: #43474d; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--wall); color: var(--wall-ink);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(16px, 4vw, 48px) 12px;
}
.scroller { width: 100%; max-width: 1120px; overflow: hidden; }
.fit { width: 760px; transform-origin: top left; }
.housing {
  background: var(--housing);
  border: 2px solid var(--housing-edge);
  border-radius: 6px;
  padding: 10px 12px 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.nameplate {
  display: flex; align-items: center; gap: 12px;
  color: #fff; font-weight: 700; font-size: 15px;
  padding: 2px 4px 10px;
}
.track {
  background: #fff; color: var(--line-red);
  font-size: 20px; line-height: 1; padding: 6px 10px; border-radius: 3px;
}
.track small { font-size: 11px; margin-left: 4px; }
.dir { line-height: 1.3; }
.dir span { display: block; font-size: 11px; font-weight: 500; opacity: .75; }
.stripe { flex: 1; height: 4px; background: var(--line-red); border-radius: 2px; }

.panel {
  position: relative; background: var(--panel);
  font-family: "DotGothic16", monospace;
  padding: 6px 14px 4px;
  border-radius: 2px;
  overflow: hidden;
}
/* LED dot mask */
.panel::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.72) 62%);
  background-size: 3px 3px;
}
.row {
  display: grid;
  grid-template-columns: 2.6em 7.6em 4.2em 1fr;
  align-items: center; gap: .6em;
  font-size: 30px; line-height: 1.5;
  color: var(--led-white);
  border-bottom: 1px solid #1a1a1a;
  white-space: nowrap;
}
.row:last-of-type { border-bottom: none; }
.row > span { perspective: 300px; }
.flap { display: inline-block; transform-origin: 50% 55%; backface-visibility: hidden; will-change: transform; }
.row .flipping .flap {
  background: linear-gradient(#1b1b1b 0 48%, #000 48% 52%, #1b1b1b 52%);
  border-radius: 3px;
}
.row .wide { grid-column: 2 / -1; color: var(--led-amber); }
.order { font-size: .62em; color: var(--led-amber); }
.type { text-align: center; }
.time { color: var(--led-amber); }
.dest { overflow: hidden; }
.cars { color: var(--led-amber); text-align: right; font-size: .8em; }
.note {
  grid-column: 1 / -1; font-size: .56em; color: var(--led-amber);
  line-height: 1.2; padding: 0 0 6px 7.2em; margin-top: -.75em;
}
.note.empty { visibility: hidden; } /* 注記がなくても行の高さを確保し、どの駅でも発車標の高さをそろえる */
.t-apk { color: var(--led-orange); }
.t-kt  { color: var(--led-green); }
.t-tk  { color: var(--led-red); }
.t-ex  { color: var(--led-blue); }
.t-lc  { color: var(--led-white); }
.t-wing { color: #d98cff; }
.t-acc { color: #ff6a3d; }
.t-rap { color: #ff8fc8; }
.t-com { color: #7f9cff; }
.en .type, .en .dest { font-size: .78em; letter-spacing: .02em; }

.ticker {
  position: relative; overflow: hidden; height: 1.6em;
  font-size: 24px; color: var(--led-amber);
  border-top: 1px solid #1a1a1a; margin-top: 2px;
}
.ticker span {
  position: absolute; white-space: nowrap; top: .15em; left: 100%;
  animation: scroll 26s linear infinite;
}
@keyframes scroll { to { transform: translateX(calc(-100% - 1100px)); } }
.daylabel { font-family: "DotGothic16", monospace; font-size: 14px; color: var(--led-amber); background: #000; padding: 4px 8px; border-radius: 2px; white-space: nowrap; }
.clock { font-family: "DotGothic16", monospace; font-size: 20px; color: #fff; background: #000; padding: 2px 8px; border-radius: 2px; }

.stgroups {
  margin-top: 20px; display: flex; flex-wrap: nowrap; gap: clamp(3px, 1.2vw, 8px); justify-content: center;
  width: 100%; max-width: 760px;
}
.stgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0; max-width: 120px; }
.stgroup .stname { font-size: clamp(10px, 3.2vw, 13px); white-space: nowrap; letter-spacing: -0.02em; font-weight: 700; text-align: center; padding-bottom: 2px; border-bottom: 3px solid var(--line-red); }
.stgroup button { padding: 8px 0 !important; font-size: clamp(12px, 3.4vw, 14px) !important; white-space: nowrap; }
.stgroup button, .controls button {
  font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--wall-ink); border: 1px solid currentColor;
}
.stgroup button[aria-pressed="true"], .controls button[aria-pressed="true"] { background: var(--wall-ink); color: var(--wall); }
.stgroup button:focus-visible { outline: 3px solid var(--line-red); outline-offset: 2px; }
.controls {
  margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  font-size: 14px;
}
.controls button {
  font: inherit; padding: 8px 14px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--wall-ink); border: 1px solid currentColor;
}
.controls button[aria-pressed="true"] { background: var(--wall-ink); color: var(--wall); }
.controls button:focus-visible { outline: 3px solid var(--line-red); outline-offset: 2px; }
.caption { margin-top: 14px; font-size: 12px; opacity: .7; text-align: center; max-width: 60ch; }

/* ホーム画面から開いたとき（アプリ表示）は、ステータスバーの下に少し余白をとる */
@media (display-mode: standalone) {
  body { padding-top: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker span { animation: none; left: 0; }
}
</style>

function parse(raw) {
  return raw.trim().split(/\s+/).map(s => {
    const m = s.match(/^(\d\d)(\d\d)([AKTELWMXRC])([A-Z]+?)(x?)([ab]?)(\d?)$/);
    return { min: +m[1] * 60 + +m[2], t: m[3], d: m[4], via: m[5] === "x", fl: m[6] || "", pf: m[7] || "" };
  });
}
function cut(list, dest, northThrough) {
  const i = list.indexOf(dest);
  if (i >= 0) return list.slice(0, i + 1).join("、") + "に停まります。";
  return list.join("、") + "に停まります。" + (northThrough ? THROUGH : "");
}

    stops: tr => cut(tr.t === "L" ? ["新馬場","北品川","品川","泉岳寺"] : ["品川","泉岳寺"], DEST[tr.d][0], true)

    flagNote: (f, en) => en ? `Rear 4 cars go only to ${f === "a" ? "Kanagawa-shimmachi" : "Kanazawa-bunko"}` : `後4両は${f === "a" ? "神奈川新町" : "金沢文庫"}止まり`
  }
];

const pad = n => String(n).padStart(2, "0");
const fmt = m => `${Math.floor(m / 60) % 24}:${pad(m % 60)}`;
const rowsEl = document.getElementById("rows");
let mode = "auto", showEn = false, st = STATIONS[0], dayMode = "auto";

// 祝日（内閣府公表の国民の祝日・振替休日・国民の休日）
const HOLIDAYS = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06",
  "2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05",
  "2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"
]);
function autoDayType(now) {
  const d = new Date(now.getTime() - 3 * 3600 * 1000); // 深夜3時までは前日のダイヤ
  const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  return (d.getDay() === 0 || d.getDay() === 6 || HOLIDAYS.has(key)) ? "hol" : "wd";
}
function currentDay() { return dayMode === "auto" ? autoDayType(new Date()) : dayMode; }
function dataFor(s) {
  const want = currentDay();
  if (s[want]) return { d: s[want], want, fallback: false };
  return { d: s[want === "wd" ? "hol" : "wd"], want, fallback: true };
}
const DAYNAME = { wd: ["平日", "Weekday"], hol: ["土休日", "Sat/Hol"] };
function updateCaption() {
  const { d, want, fallback } = dataFor(st);
  let cap = `京急線の時刻表（${d.src}）の全列車を収録しています。遅延や臨時列車は反映されません。種別色はエアポート快特の橙以外は近似です。`;
  if (fallback) cap += ` この方面は${DAYNAME[want][0]}ダイヤがまだ入っていないため、${DAYNAME[want === "wd" ? "hol" : "wd"][0]}ダイヤを表示しています。実際の時刻とは異なります。`;
  const c = document.getElementById("caption");
  if (c.textContent !== cap) c.textContent = cap;
}

// ===== パタパタ（反転フラップ）表示 =====
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const CELLS = ["order", "type", "time", "dest", "note"];
const boardRows = [];
let lastCtx = null, lastTrains = null;
function buildBoard() {
  for (let i = 0; i < 3; i++) {
    const row = document.createElement("div");
    row.className = "row";
    const cells = {};
    for (const c of CELLS) {
      const el = document.createElement("span");
      el.className = c;
      const f = document.createElement("span");
      f.className = "flap";
      f.textContent = "\u00a0";
      el.appendChild(f);
      el.dataset.v = "";
      if (c === "note") el.classList.add("empty");
      row.appendChild(el);
      cells[c] = el;
    }
    rowsEl.appendChild(row);
    boardRows.push({ row, cells });
  }
}
const KANA = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
const DIGITS = "0123456789";
function scramble(text, kind) {
  if (!text) return "";
  return [...text].map(ch => {
    if (ch === ":" || ch === " " || ch === "　" || ch === "・") return ch;
    if (kind === "time" || /\d/.test(ch)) return DIGITS[Math.floor(Math.random() * 10)];
    if (/[A-Za-z]/.test(ch)) return String.fromCharCode(65 + Math.floor(Math.random() * 26));
    return KANA[Math.floor(Math.random() * KANA.length)];
  }).join("");
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function anim(el, from, to, ms) {
  if (!el.animate) return sleep(ms);
  return el.animate([{ transform: `rotateX(${from}deg)` }, { transform: `rotateX(${to}deg)` }],
                    { duration: ms, easing: "ease-in", fill: "forwards" }).finished.catch(() => {});
}
async function flipCell(el, kind, text, cls, delay, animate) {
  const tok = (el._tok || 0) + 1; el._tok = tok;
  const flap = el.firstChild;
  const finalClass = kind + (cls ? " " + cls : "") + (kind === "note" && !text ? " empty" : "");
  if (REDUCED || !animate) { flap.textContent = text || "\u00a0"; el.className = finalClass; return; }
  if (kind === "note" && text) el.classList.remove("empty");
  await sleep(delay);
  if (el._tok !== tok) return;
  el.classList.add("flipping");
  // 1セルあたり 7〜10回めくれて止まる（セルごとに止まるタイミングを少しずらす）
  const steps = 7 + Math.floor(Math.random() * 4);
  for (let k = 0; k < steps; k++) {
    if (el._tok !== tok) return;
    const slow = k >= steps - 2 ? 1.6 : 1;      // 止まる直前は少しゆっくり
    await anim(flap, 0, 90, 75 * slow);
    if (el._tok !== tok) return;
    flap.textContent = scramble(text || flap.textContent, kind) || "\u00a0";
    await anim(flap, -90, 0, 65 * slow);
  }
  if (el._tok !== tok) return;
  await anim(flap, 0, 90, 130);
  if (el._tok !== tok) return;
  flap.textContent = text || "\u00a0";
  el.className = finalClass;
  await anim(flap, -90, 0, 200);
}
function updateBoard(specs, en, animate) {
  if (!boardRows.length) buildBoard();
  specs.forEach((sp, i) => {
    const { row, cells } = boardRows[i];
    row.classList.toggle("en", en);
    const vals = {
      order: [sp.order, ""], type: [sp.type, sp.tcls], time: [sp.time, ""],
      dest: [sp.dest, sp.wide ? "wide" : ""], note: [sp.note, ""]
    };
    CELLS.forEach((c, j) => {
      const [text, cls] = vals[c];
      const key = text + "|" + cls;
      const el = cells[c];
      if (el.dataset.v === key) return;
      el.dataset.v = key;
      if (c === "type" || c === "time") { cells.type.style.display = cells.time.style.display = sp.wide ? "none" : ""; }
      flipCell(el, c, text, cls, i * 300 + j * 120, animate);
    });
  });
}

function render() {
  const now = new Date();
  document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let nowMin = now.getHours() * 60 + now.getMinutes();
  if (nowMin < 180) nowMin += 1440;
  const en = mode === "en" || (mode === "auto" && showEn);
  const order = en ? ["Next", "2nd", "3rd"] : ["先発", "次発", "次々発"];
  const { d: dd, want } = dataFor(st);
  const trains = dd.trains;
  const dl = document.getElementById("dayLabel");
  const dlText = DAYNAME[want][en ? 1 : 0];
  if (dl.textContent !== dlText) dl.textContent = dlText;
  updateCaption();
  const next = trains.filter(tr => tr.min >= nowMin).slice(0, 3);
  const tk = document.getElementById("ticker");
  const setTicker = msg => {
    if (tk.textContent !== msg) { tk.textContent = msg; if (tk.style) tk.style.animationDuration = Math.max(18, msg.length * 0.45) + "s"; }
  };

  let specs;
  if (next.length === 0) {
    specs = [
      { order: "", type: "", tcls: "", time: "", dest: en ? "Service has ended for today." : "本日の運転は終了しました", wide: true, note: "" },
      { order: "", type: "", tcls: "", time: "", dest: "", note: "" },
      { order: "", type: "", tcls: "", time: "", dest: "", note: "" }
    ];
  } else {
    specs = [0, 1, 2].map(i => {
      const tr = next[i];
      if (!tr) return { order: "", type: "", tcls: "", time: "", dest: "", note: "" };
      const ty = TYPES[tr.t], de = DEST[tr.d];
      const parts = [];
      if (tr.pf) parts.push(en ? `Track ${tr.pf}` : `${tr.pf}番線から発車`);
      if (tr.via) parts.push(en ? "via Narita Sky Access Line" : "成田スカイアクセス線経由");
      if (tr.fl && st.flagNote) parts.push(st.flagNote(tr.fl, en));
      return { order: order[i], type: en ? ty.en : ty.ja, tcls: ty.cls, time: fmt(tr.min),
               dest: en ? de[1] : de[0], note: parts.join(en ? " / " : "　") };
    });
  }
  // パタパタは「先発が発車して表示が繰り上がったとき」だけ。日英切替・駅/ダイヤ切替は即時に切り替える
  const ctxKey = st.id + "|" + want;
  const trainKey = next.map(t => t.min + t.t + t.d).join(",");
  const animate = lastCtx === ctxKey && lastTrains !== null && lastTrains !== trainKey;
  lastCtx = ctxKey; lastTrains = trainKey;
  updateBoard(specs, en, animate);
  if (next.length === 0) {
    const f = trains[0];
    setTicker(en ? `The first train departs at ${fmt(f.min)}.` : `始発は ${fmt(f.min)} 発 ${TYPES[f.t].ja} ${DEST[f.d][0]}行きです。`);
    return;
  }
  const f = next[0];
  setTicker(en
    ? `The next train is the ${TYPES[f.t].en} bound for ${DEST[f.d][1]}${f.via ? " via Narita Sky Access Line" : ""}, departing at ${fmt(f.min)}.`
    : `先発の ${TYPES[f.t].ja} ${DEST[f.d][0]}行き${f.via ? "（成田スカイアクセス線経由）" : ""}は、${f.pf ? f.pf + "番線から発車します。" : ""}${st.stops(f)}`);
}

function selectStation(s) {
  st = s;
  document.getElementById("stName").innerHTML = `${s.name}<small>${s.sub}</small>`;
  document.getElementById("stDir").innerHTML = `${s.dirJa}<span>${s.dirEn}</span>`;
  document.querySelectorAll("#stationBtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === s.id)));
  render();
}
// 駅ごとに「上り・下り（・空港線）」を縦に並べる
const sb = document.getElementById("stationBtns");
const groups = new Map();
STATIONS.forEach(s => {
  const b = document.createElement("button");
  b.dataset.id = s.id;
  b.onclick = () => selectStation(s);
  b.textContent = s.label.replace(s.name, "").trim();
  let g = groups.get(s.name);
  if (!g) {
    g = document.createElement("div"); g.className = "stgroup";
    const h = document.createElement("div"); h.className = "stname"; h.textContent = s.name;
    g.appendChild(h); sb.appendChild(g); groups.set(s.name, g);
  }
  g.appendChild(b);
});

function setMode(m) {
  mode = m;
  for (const [id, v] of [["btnAuto","auto"],["btnJa","ja"],["btnEn","en"]])
    document.getElementById(id).setAttribute("aria-pressed", String(v === m));
  render();
}
function setDay(m) {
  dayMode = m;
  for (const [id, v] of [["dayAuto","auto"],["dayWd","wd"],["dayHol","hol"]])
    document.getElementById(id).setAttribute("aria-pressed", String(v === m));
  render();
}
document.getElementById("dayAuto").onclick = () => setDay("auto");
document.getElementById("dayWd").onclick = () => setDay("wd");
document.getElementById("dayHol").onclick = () => setDay("hol");
document.getElementById("btnAuto").onclick = () => setMode("auto");
document.getElementById("btnJa").onclick = () => setMode("ja");
document.getElementById("btnEn").onclick = () => setMode("en");

// 画面幅に合わせて発車標全体を拡大縮小（iPhone縦向きでも横スクロールなしで収まる）
const fitEl = document.getElementById("fit"), scEl = document.getElementById("scroller");
function fit() {
  const scale = Math.min(scEl.clientWidth / 760, 1.45);
  fitEl.style.transform = `scale(${scale})`;
  scEl.style.height = (fitEl.offsetHeight * scale) + "px";
}
window.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(fitEl);
window.addEventListener("orientationchange", () => setTimeout(fit, 200));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

// 画面を消さない（Screen Wake Lock API、iOS 16.4以降のSafariなど）
let wakeLock = null;
const wakeBtn = document.getElementById("btnWake");
async function requestWake() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeBtn.setAttribute("aria-pressed", "true");
    wakeLock.addEventListener("release", () => wakeBtn.setAttribute("aria-pressed", "false"));
  } catch (e) {
    wakeBtn.textContent = "この端末では使えません";
  }
}
if (!("wakeLock" in navigator)) wakeBtn.style.display = "none";
wakeBtn.onclick = async () => {
  if (wakeLock && !wakeLock.released) { await wakeLock.release(); wakeLock = null; }
  else requestWake();
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wakeBtn.getAttribute("aria-pressed") === "false" && wakeLock) requestWake();
});

selectStation(STATIONS[0]);
fit();
setInterval(render, 1000);
setInterval(() => { showEn = !showEn; if (mode === "auto") render(); }, 5000);
</script>
