<title>京急線 駅ホーム発車標</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --wall: #c9ccce;
  --wall-ink: #2a2d31;
  --housing: #3a3d42;
  --housing-edge: #55595f;
  --panel: #000;
  --led-white: #f2f2ea;
  --led-amber: #ffa21a;
  --led-orange: #ff7a1a;
  --led-green: #2fe06a;
  --led-red: #ff3b30;
  --led-blue: #3aa8ff;
  --line-red: #d7141a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --wall: #1c1e21; --wall-ink: #c9ccd1; --housing: #2b2e33; --housing-edge: #43474d; }
}
:root[data-theme="dark"] { --wall: #1c1e21; --wall-ink: #c9ccd1; --housing: #2b2e33; --housing-edge: #43474d; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--wall); color: var(--wall-ink);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(16px, 4vw, 48px) 12px;
}
.scroller { width: 100%; max-width: 1120px; overflow: hidden; }
.fit { width: 760px; transform-origin: top left; }
.housing {
  background: var(--housing);
  border: 2px solid var(--housing-edge);
  border-radius: 6px;
  padding: 10px 12px 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.nameplate {
  display: flex; align-items: center; gap: 12px;
  color: #fff; font-weight: 700; font-size: 15px;
  padding: 2px 4px 10px;
}
.track {
  background: #fff; color: var(--line-red);
  font-size: 20px; line-height: 1; padding: 6px 10px; border-radius: 3px;
}
.track small { font-size: 11px; margin-left: 4px; }
.dir { line-height: 1.3; }
.dir span { display: block; font-size: 11px; font-weight: 500; opacity: .75; }
.stripe { flex: 1; height: 4px; background: var(--line-red); border-radius: 2px; }

.panel {
  position: relative; background: var(--panel);
  font-family: "DotGothic16", monospace;
  padding: 6px 14px 4px;
  border-radius: 2px;
  overflow: hidden;
}
/* LED dot mask */
.panel::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.72) 62%);
  background-size: 3px 3px;
}
.row {
  display: grid;
  grid-template-columns: 2.6em 7.6em 4.2em 1fr;
  align-items: center; gap: .6em;
  font-size: 30px; line-height: 1.5;
  color: var(--led-white);
  border-bottom: 1px solid #1a1a1a;
  white-space: nowrap;
}
.row:last-of-type { border-bottom: none; }
.order { font-size: .62em; color: var(--led-amber); }
.type { text-align: center; }
.time { color: var(--led-amber); }
.dest { overflow: hidden; }
.cars { color: var(--led-amber); text-align: right; font-size: .8em; }
.note {
  grid-column: 1 / -1; font-size: .56em; color: var(--led-amber);
  line-height: 1.4; padding: 0 0 4px 7.2em; margin-top: -.3em;
}
.note:empty { display: none; }
.t-apk { color: var(--led-orange); }
.t-kt  { color: var(--led-green); }
.t-tk  { color: var(--led-red); }
.t-ex  { color: var(--led-blue); }
.t-lc  { color: var(--led-white); }
.en .type, .en .dest { font-size: .78em; letter-spacing: .02em; }

.ticker {
  position: relative; overflow: hidden; height: 1.6em;
  font-size: 24px; color: var(--led-amber);
  border-top: 1px solid #1a1a1a; margin-top: 2px;
}
.ticker span {
  position: absolute; white-space: nowrap; top: .15em; left: 100%;
  animation: scroll 26s linear infinite;
}
@keyframes scroll { to { transform: translateX(calc(-100% - 1100px)); } }
.clock { font-family: "DotGothic16", monospace; font-size: 20px; color: #fff; background: #000; padding: 2px 8px; border-radius: 2px; }

.controls {
  margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  font-size: 14px;
}
.controls button {
  font: inherit; padding: 8px 14px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--wall-ink); border: 1px solid currentColor;
}
.controls button[aria-pressed="true"] { background: var(--wall-ink); color: var(--wall); }
.controls button:focus-visible { outline: 3px solid var(--line-red); outline-offset: 2px; }
.caption { margin-top: 14px; font-size: 12px; opacity: .7; text-align: center; max-width: 60ch; }

@media (prefers-reduced-motion: reduce) {
  .ticker span { animation: none; left: 0; }
}
</style>
</head>

<div class="scroller" id="scroller">

    </div>
    <div class="panel" id="panel">

      <div class="ticker"><span id="ticker"></span></div>

</div>

function parse(raw) {
  return raw.trim().split(/\s+/).map(s => {
    const m = s.match(/^(\d\d)(\d\d)([AKTEL])([A-Z]+?)(x?)$/);
    return { min: +m[1] * 60 + +m[2], t: m[3], d: m[4], via: m[5] === "x" };
  });
}
function cut(list, dest, northThrough) {
  const i = list.indexOf(dest);
  if (i >= 0) return list.slice(0, i + 1).join("、") + "に停まります。";
  return list.join("、") + "に停まります。" + (northThrough ? THROUGH : "");
}

const pad = n => String(n).padStart(2, "0");
const fmt = m => `${Math.floor(m / 60) % 24}:${pad(m % 60)}`;
const rowsEl = document.getElementById("rows");
let mode = "auto", showEn = false, st = STATIONS[0];

function render() {
  const now = new Date();
  document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let nowMin = now.getHours() * 60 + now.getMinutes();
  if (nowMin < 180) nowMin += 1440;
  const en = mode === "en" || (mode === "auto" && showEn);
  const order = en ? ["Next", "2nd", "3rd"] : ["先発", "次発", "次々発"];
  const next = st.trains.filter(tr => tr.min >= nowMin).slice(0, 3);
  const tk = document.getElementById("ticker");
  const setTicker = msg => {
    if (tk.textContent !== msg) { tk.textContent = msg; if (tk.style) tk.style.animationDuration = Math.max(18, msg.length * 0.45) + "s"; }
  };

  if (next.length === 0) {
    rowsEl.innerHTML = `<div class="row"><span></span><span style="grid-column:2/-1;color:var(--led-amber)">${en ? "Service has ended for today." : "本日の運転は終了しました"}</span></div>`;
    const f = st.trains[0];
    setTicker(en ? `The first train departs at ${fmt(f.min)}.` : `始発は ${fmt(f.min)} 発 ${TYPES[f.t].ja} ${DEST[f.d][0]}行きです。`);
    return;
  }
  rowsEl.innerHTML = next.map((tr, i) => {
    const ty = TYPES[tr.t], de = DEST[tr.d];
    const note = tr.via ? (en ? "via Narita Sky Access Line" : "成田スカイアクセス線経由") : "";
    return `<div class="row ${en ? "en" : ""}">
      <span class="order">${order[i]}</span>
      <span class="type ${ty.cls}">${en ? ty.en : ty.ja}</span>
      <span class="time">${fmt(tr.min)}</span>
      <span class="dest">${en ? de[1] : de[0]}</span>
      <span class="note">${note}</span>
    </div>`;
  }).join("");
  const f = next[0];
  setTicker(en
    ? `The next train is the ${TYPES[f.t].en} bound for ${DEST[f.d][1]}${f.via ? " via Narita Sky Access Line" : ""}, departing at ${fmt(f.min)}.`
    : `先発の ${TYPES[f.t].ja} ${DEST[f.d][0]}行き${f.via ? "（成田スカイアクセス線経由）" : ""}は、${st.stops(f)}`);
}

function selectStation(s) {
  st = s;
  document.getElementById("stName").innerHTML = `${s.name}<small>${s.sub}</small>`;
  document.getElementById("stDir").innerHTML = `${s.dirJa}<span>${s.dirEn}</span>`;
  let cap = `京急公式の各駅時刻表（${s.src}）の全列車を収録しています。遅延や臨時列車は反映されません。種別色はエアポート快特の橙以外は近似です。`;
  const day = new Date().getDay();
  if (day === 0 || day === 6) cap += " 今日は土休日ですが、表示しているのは平日ダイヤです。";
  document.getElementById("caption").textContent = cap;
  document.querySelectorAll("#stationBtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === s.id)));
  render();
}
const sb = document.getElementById("stationBtns");
STATIONS.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s.label; b.dataset.id = s.id;
  b.onclick = () => selectStation(s);
  sb.appendChild(b);
});

function setMode(m) {
  mode = m;
  for (const [id, v] of [["btnAuto","auto"],["btnJa","ja"],["btnEn","en"]])
    document.getElementById(id).setAttribute("aria-pressed", String(v === m));
  render();
}
document.getElementById("btnAuto").onclick = () => setMode("auto");
document.getElementById("btnJa").onclick = () => setMode("ja");
document.getElementById("btnEn").onclick = () => setMode("en");

// 画面幅に合わせて発車標全体を拡大縮小（iPhone縦向きでも横スクロールなしで収まる）
const fitEl = document.getElementById("fit"), scEl = document.getElementById("scroller");
function fit() {
  const scale = Math.min(scEl.clientWidth / 760, 1.45);
  fitEl.style.transform = `scale(${scale})`;
  scEl.style.height = (fitEl.offsetHeight * scale) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 200));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

// 画面を消さない（Screen Wake Lock API、iOS 16.4以降のSafariなど）
let wakeLock = null;
const wakeBtn = document.getElementById("btnWake");
async function requestWake() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeBtn.setAttribute("aria-pressed", "true");
    wakeLock.addEventListener("release", () => wakeBtn.setAttribute("aria-pressed", "false"));
  } catch (e) {
    wakeBtn.textContent = "この端末では使えません";
  }
}
if (!("wakeLock" in navigator)) wakeBtn.style.display = "none";
wakeBtn.onclick = async () => {
  if (wakeLock && !wakeLock.released) { await wakeLock.release(); wakeLock = null; }
  else requestWake();
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wakeBtn.getAttribute("aria-pressed") === "false" && wakeLock) requestWake();
});

selectStation(STATIONS[0]);
fit();
setInterval(render, 1000);
setInterval(() => { showEn = !showEn; if (mode === "auto") render(); }, 5000);
